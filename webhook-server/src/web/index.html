<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs Deploy Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0d14;color:#e0e6ed;min-height:100vh;padding:20px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
.glass{background:rgba(255,255,255,0.03);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:32px}
.login-box{width:360px}
.login-box h1{text-align:center;margin-bottom:24px;font-size:1.5rem;color:#fff}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:0.85rem;color:#8b95a5}
.form-group input{width:100%;padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:0.9rem;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:#0a7eff}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:0.9rem;cursor:pointer;transition:all .2s;font-weight:500}
.btn-primary{background:#0a7eff;color:#fff;width:100%}
.btn-primary:hover{background:#0862cc;box-shadow:0 0 20px rgba(10,126,255,0.3)}
.btn-sm{padding:6px 12px;font-size:0.8rem;border-radius:6px}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.15);color:#e0e6ed}
.btn-outline:hover{border-color:#0a7eff;color:#0a7eff}
.btn-danger{background:rgba(255,59,48,0.15);color:#ff3b30;border:1px solid rgba(255,59,48,0.3)}
.btn-danger:hover{background:rgba(255,59,48,0.25)}
.btn-success{background:rgba(52,199,89,0.15);color:#34c759;border:1px solid rgba(52,199,89,0.3)}
.btn-success:hover{background:rgba(52,199,89,0.25)}
.btn-warning{background:rgba(255,159,10,0.15);color:#ff9f0a;border:1px solid rgba(255,159,10,0.3)}
.btn-warning:hover{background:rgba(255,159,10,0.25)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.header h1{font-size:1.4rem;color:#fff}
.header-right{display:flex;align-items:center;gap:8px}
.role-badge{font-size:0.75rem;padding:3px 8px;border-radius:4px;background:rgba(10,126,255,0.15);color:#0a7eff;border:1px solid rgba(10,126,255,0.3)}
.repo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px}
.repo-card{position:relative;overflow:hidden}
.repo-card .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.repo-card .card-header h3{font-size:1rem;color:#fff}
.repo-card .meta{font-size:0.8rem;color:#6b7685;margin-bottom:12px;word-break:break-all}
.repo-card .actions{display:flex;gap:8px;flex-wrap:wrap}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-idle .status-dot{background:#34c759;box-shadow:0 0 6px rgba(52,199,89,0.6);animation:pulse 2s infinite}
.status-syncing .status-dot,.status-building .status-dot,.status-deploying .status-dot{background:#ff9f0a;box-shadow:0 0 6px rgba(255,159,10,0.6);animation:pulse 1s infinite}
.status-error .status-dot{background:#ff3b30;box-shadow:0 0 6px rgba(255,59,48,0.6)}
.status-badge{font-size:0.75rem;display:inline-flex;align-items:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.show{display:flex}
.modal{width:420px}
.modal h2{margin-bottom:20px;font-size:1.2rem;color:#fff}
.modal p{margin-bottom:20px;font-size:0.9rem;color:#8b95a5;line-height:1.5}
.modal .form-actions{display:flex;gap:10px;margin-top:20px}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:10px;font-size:0.85rem;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.success{background:rgba(52,199,89,0.2);border:1px solid rgba(52,199,89,0.4);color:#34c759}
.toast.error{background:rgba(255,59,48,0.2);border:1px solid rgba(255,59,48,0.4);color:#ff3b30}
.info-row{font-size:0.75rem;color:#6b7685;margin-top:8px}
#app{display:none}
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:20px}
.loading-overlay.show{display:flex}
.loading-spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,0.1);border-top-color:#0a7eff;border-radius:50%;animation:spin 0.8s linear infinite}
.loading-text{font-size:1rem;color:#e0e6ed}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="glass login-box">
    <h1>Docs Deploy Manager</h1>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Login</button>
  </div>
</div>

<div id="app">
  <div class="header">
    <h1>Docs Deploy Manager</h1>
    <div class="header-right">
      <span id="role-badge" class="role-badge"></span>
      <button id="btn-add-repo" class="btn btn-sm btn-primary" onclick="showAddModal()" style="display:none">Add Repository</button>
      <button class="btn btn-sm btn-outline" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div id="repo-grid" class="repo-grid"></div>
</div>

<div id="add-modal" class="modal-overlay">
  <div class="glass modal">
    <h2>Add Repository</h2>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="repo-name" placeholder="my-docs">
    </div>
    <div class="form-group">
      <label>Git URL</label>
      <input type="text" id="repo-url" placeholder="https://github.com/user/repo.git">
    </div>
    <div class="form-group">
      <label>Branch</label>
      <input type="text" id="repo-branch" placeholder="main" value="main">
    </div>
    <div class="form-group">
      <label>Deploy Folder Name (optional, defaults to Name)</label>
      <input type="text" id="repo-deploy-name" placeholder="custom-folder-name">
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="doAddRepo()">Add</button>
      <button class="btn btn-outline" onclick="hideAddModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="edit-modal" class="modal-overlay">
  <div class="glass modal">
    <h2>Edit Repository</h2>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="edit-name">
    </div>
    <div class="form-group">
      <label>Git URL</label>
      <input type="text" id="edit-url">
    </div>
    <div class="form-group">
      <label>Branch</label>
      <input type="text" id="edit-branch">
    </div>
    <div class="form-group">
      <label>Deploy Folder Name (optional, defaults to Name)</label>
      <input type="text" id="edit-deploy-name" placeholder="custom-folder-name">
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="doEditRepo()">Save</button>
      <button class="btn btn-outline" onclick="hideEditModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="confirm-modal" class="modal-overlay">
  <div class="glass modal">
    <h2 id="confirm-title"></h2>
    <p id="confirm-message"></p>
    <div class="form-actions">
      <button class="btn btn-primary" id="confirm-ok" onclick="confirmOk()">Confirm</button>
      <button class="btn btn-outline" onclick="hideConfirm()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="loading-overlay" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">Loading...</div>
</div>

<script>
let token = localStorage.getItem('token') || '';
let userRole = localStorage.getItem('role') || '';
const API = '';

function $(id){ return document.getElementById(id) }

function showLoading(text){
  $('loading-text').textContent = text || 'Loading...';
  $('loading-overlay').classList.add('show');
}
function hideLoading(){
  $('loading-overlay').classList.remove('show');
}

function toast(msg, type='success'){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(()=> t.className='toast', 3000);
}

async function api(path, opts={}){
  const headers = {'Content-Type':'application/json'};
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, {...opts, headers});
  if(res.status === 401){ doLogout(); throw new Error('Unauthorized'); }
  if(res.status === 403){ toast('Permission denied','error'); throw new Error('Forbidden'); }
  return res;
}

async function doLogin(){
  const username = $('username').value;
  const password = $('password').value;
  try{
    const res = await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    if(!res.ok){ toast('Login failed','error'); return; }
    const data = await res.json();
    token = data.token;
    userRole = data.role;
    localStorage.setItem('token', token);
    localStorage.setItem('role', userRole);
    showApp();
  }catch(e){ toast('Login error','error'); }
}

function doLogout(){
  token='';
  userRole='';
  localStorage.removeItem('token');
  localStorage.removeItem('role');
  $('login').style.display='flex';
  $('app').style.display='none';
}

async function showApp(){
  $('login').style.display='none';
  $('app').style.display='block';
  $('role-badge').textContent = userRole === 'admin' ? 'Admin' : 'User';
  if(userRole === 'admin'){
    $('btn-add-repo').style.display='';
  } else {
    $('btn-add-repo').style.display='none';
  }
  await loadRepos();
}

async function loadRepos(){
  try{
    const res = await api('/admin/repos');
    const repos = await res.json();
    renderRepos(repos);
  }catch(e){}
}

function renderRepos(repos){
  const grid = $('repo-grid');
  const isAdmin = userRole === 'admin';
  if(!repos.length){
    grid.innerHTML='<div class="glass" style="padding:40px;text-align:center;color:#6b7685">No repositories yet.' + (isAdmin ? ' Click "Add Repository" to get started.' : '') + '</div>';
    return;
  }
  grid.innerHTML = repos.map(r=>{
    const statusClass = 'status-'+(r.status||'idle');
    const lastSync = r.last_sync ? new Date(r.last_sync).toLocaleString() : 'Never';
    const lastBuild = r.last_build ? new Date(r.last_build).toLocaleString() : 'Never';
    const lastDeploy = r.last_deploy ? new Date(r.last_deploy).toLocaleString() : 'Never';
    const busy = r.status && r.status !== 'idle' && r.status !== 'error';
    const deployName = r.deploy_name || r.name;
    return `<div class="glass repo-card ${statusClass}">
      <div class="card-header">
        <h3>${esc(r.name)}</h3>
        <span class="status-badge"><span class="status-dot"></span>${esc(r.status||'idle')}</span>
      </div>
      <div class="meta">${esc(r.git_url)} @ ${esc(r.branch)}${r.deploy_name ? ' → '+esc(r.deploy_name) : ''}</div>
      ${r.last_message?`<div class="info-row" style="margin-bottom:8px">${esc(r.last_message.substring(0,120))}</div>`:''}
      <div class="info-row">Sync: ${lastSync} | Build: ${lastBuild} | Publish: ${lastDeploy}</div>
      <div class="actions" style="margin-top:12px">
        <button class="btn btn-sm btn-outline" onclick="confirmAction('sync','${r.id}','${esc(r.name)}')" ${busy?'disabled':''}>Sync</button>
        <button class="btn btn-sm btn-outline" onclick="confirmAction('build','${r.id}','${esc(r.name)}')" ${busy?'disabled':''}>Build</button>
        ${isAdmin?`<button class="btn btn-sm btn-success" onclick="confirmAction('publish','${r.id}','${esc(r.name)}')" ${busy?'disabled':''}>Publish</button>`:''}
        ${isAdmin?`<button class="btn btn-sm btn-warning" onclick="showEditModal('${r.id}','${esc(r.name)}','${esc(r.git_url)}','${esc(r.branch)}','${esc(r.deploy_name||'')}')">Edit</button>`:''}
        ${isAdmin?`<button class="btn btn-sm btn-danger" onclick="doDelete('${r.id}')">Delete</button>`:''}
      </div>
    </div>`;
  }).join('');
}

function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):''}

function showAddModal(){ $('add-modal').classList.add('show') }
function hideAddModal(){ $('add-modal').classList.remove('show') }

// Confirmation dialog
let pendingAction = null;

function confirmAction(action, id, name){
  const titles = {sync:'Sync Repository', build:'Build Repository', publish:'Publish to Production'};
  const messages = {
    sync:`Are you sure you want to sync "${name}"? This will pull the latest code from the remote repository.`,
    build:`Are you sure you want to build "${name}"? This will rebuild the documentation.`,
    publish:`Are you sure you want to publish "${name}" to the production server? This action will update the live site.`
  };
  $('confirm-title').textContent = titles[action] || action;
  $('confirm-message').textContent = messages[action] || '';
  pendingAction = {action, id};
  $('confirm-modal').classList.add('show');
}

function hideConfirm(){
  $('confirm-modal').classList.remove('show');
  pendingAction = null;
}

async function confirmOk(){
  if(!pendingAction) return;
  const {action, id} = pendingAction;
  hideConfirm();
  const loadingTexts = {sync:'Syncing repository...', build:'Building documentation...', publish:'Publishing to production server...'};
  showLoading(loadingTexts[action] || 'Processing...');
  if(action === 'sync') await doSync(id);
  else if(action === 'build') await doBuild(id);
  else if(action === 'publish') await doDeploy(id);
  hideLoading();
}

async function doAddRepo(){
  const name = $('repo-name').value.trim();
  const git_url = $('repo-url').value.trim();
  const branch = $('repo-branch').value.trim() || 'main';
  const deploy_name = $('repo-deploy-name').value.trim() || null;
  if(!name||!git_url){ toast('Name and URL required','error'); return; }
  try{
    const res = await api('/admin/repos',{method:'POST',body:JSON.stringify({name,git_url,branch,deploy_name})});
    if(res.ok){ toast('Repository added'); hideAddModal(); $('repo-name').value=''; $('repo-url').value=''; $('repo-deploy-name').value=''; loadRepos(); }
    else toast('Failed to add','error');
  }catch(e){ toast('Error','error'); }
}

async function doDelete(id){
  pendingAction = {action:'delete', id};
  $('confirm-title').textContent = 'Delete Repository';
  $('confirm-message').textContent = 'Are you sure you want to delete this repository? This action cannot be undone.';
  $('confirm-modal').classList.add('show');
  $('confirm-ok').onclick = async function(){
    hideConfirm();
    showLoading('Deleting repository...');
    try{
      const res = await api('/admin/repos/'+id,{method:'DELETE'});
      if(res.ok){ toast('Deleted'); loadRepos(); }
      else toast('Failed','error');
    }catch(e){ toast('Error','error'); }
    hideLoading();
    $('confirm-ok').onclick = confirmOk;
  };
}

async function doSync(id){
  try{
    const res = await api('/admin/repos/'+id+'/sync',{method:'POST'});
    const data = await res.json();
    toast(data.message || data.status, data.status==='ok'?'success':'error');
    loadRepos();
  }catch(e){ toast('Error','error'); }
}

async function doBuild(id){
  try{
    const res = await api('/admin/repos/'+id+'/build',{method:'POST'});
    const data = await res.json();
    toast(data.message || data.status, data.status==='ok'?'success':'error');
    loadRepos();
  }catch(e){ toast('Error','error'); }
}

async function doDeploy(id){
  try{
    const res = await api('/admin/repos/'+id+'/deploy',{method:'POST'});
    const data = await res.json();
    toast(data.message || data.status, data.status==='ok'?'success':'error');
    loadRepos();
  }catch(e){ toast('Error','error'); }
}

function showEditModal(id, name, git_url, branch, deploy_name){
  $('edit-id').value = id;
  $('edit-name').value = name;
  $('edit-url').value = git_url;
  $('edit-branch').value = branch;
  $('edit-deploy-name').value = deploy_name;
  $('edit-modal').classList.add('show');
}

function hideEditModal(){ $('edit-modal').classList.remove('show'); }

async function doEditRepo(){
  const id = $('edit-id').value;
  const name = $('edit-name').value.trim();
  const git_url = $('edit-url').value.trim();
  const branch = $('edit-branch').value.trim();
  const deploy_name = $('edit-deploy-name').value.trim();
  if(!name||!git_url){ toast('Name and URL required','error'); return; }
  try{
    const res = await api('/admin/repos/'+id,{method:'PUT',body:JSON.stringify({name,git_url,branch,deploy_name})});
    if(res.ok){ toast('Repository updated'); hideEditModal(); loadRepos(); }
    else toast('Failed to update','error');
  }catch(e){ toast('Error','error'); }
}

if(token){ showApp(); } else { $('login').style.display='flex'; }
</script>
</body>
</html>
